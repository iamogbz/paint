<!DOCTYPE html>
<html>
<body>
  <div style="transform: scale(2); transform-origin: 0 0;">
    <svg id="s" width="100" height="100" viewBox="0 0 500 500">
      <path id="p" d="M0 0 L500 500"/>
    </svg>
  </div>
  <script>
    const svg = document.getElementById('s');
    const path = document.getElementById('p');
    console.log("SVG CTM:", svg.getScreenCTM().a, svg.getScreenCTM().d);
    console.log("Path CTM:", path.getScreenCTM().a, path.getScreenCTM().d);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
  <div id="container" style="width: 300px; height: 300px; border: 1px solid black; overflow: hidden; position: relative;">
    <div id="transform" style="width: 100%; height: 100%; transform-origin: center center; transform: translate(0px, 0px) scale(1);">
      <svg width="100%" height="100%" viewBox="0 0 100 100">
        <path d="M10,10 L90,10 L90,90 L10,90 Z" fill="red" style="mix-blend-mode: multiply;" />
      </svg>
    </div>
  </div>
  <button onclick="document.getElementById('transform').style.transform = 'translate(0px, 0px) scale(5)';">Scale 5x</button>
  <button onclick="document.getElementById('transform').style.transform = 'translate(0px, 0px) scale(1)';">Scale 1x</button>
</body>
</html>

[build]
  publish = "dist"
  command = "npm run build"

# -------------------------------------------------------------------
# SPA Fallback Routing
# -------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# -------------------------------------------------------------------
# Service Worker Files (NEVER CACHE)
# Ensures browsers check for new service worker scripts on every page load
# -------------------------------------------------------------------
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# -------------------------------------------------------------------
# App Shell & Manifest (NEVER CACHE)
# Ensures new JS/CSS chunk hashes and manifest entries are fetched immediately
# -------------------------------------------------------------------
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# -------------------------------------------------------------------
# Content-Hashed Assets (LONG-TERM IMMUTABLE CACHE)
# Vite generated build assets in /assets/ have unique hashes per release
# -------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

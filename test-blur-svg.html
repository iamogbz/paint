<!DOCTYPE html>
<html>
<body>
  <div style="width: 300px; height: 300px; border: 1px solid black; overflow: hidden; position: relative;">
    <svg width="100%" height="100%" viewBox="0 0 100 100">
      <defs>
        <clipPath id="cp">
          <path d="M10,10 L90,10 L90,90 L10,90 Z" />
        </clipPath>
      </defs>
      <g transform="scale(5)" transform-origin="50 50">
        <path d="M10,10 L90,10 L90,90 L10,90 Z" fill="red" clip-path="url(#cp)" style="mix-blend-mode: multiply;" />
        <circle cx="50" cy="50" r="40" fill="blue" clip-path="url(#cp)"/>
      </g>
    </svg>
  </div>
</body>
</html>
